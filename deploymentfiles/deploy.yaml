---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: fb-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fb-app
  template:
    metadata:
      labels: 
        app: fb-app
    spec:
      containers:
      - name: fb-container
        image: gollarakesh/dockrepo1:4
        ports:
        -containerPort: 8080
